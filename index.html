<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aplicando Fetch</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Consulta de CEP</h1>

    <input
        type="text"
        id="cep"
        placeholder="Digite seu CEP"
        maxlength="9"
    >

    <button onclick="buscarCep()">Buscar CEP</button>

    <div id="resultado"></div>

    <hr>

    <h1>Frases do Chuck Norris</h1>

    <button onclick="buscarFrase()">Nova frase</button>

    <p id="frase">
        Clique no botão para carregar uma frase!
    </p>

    <script>
        // CONSULTA DE CEP - VIACEP
        async function buscarCep() {
            const cep = document.getElementById("cep").value
                .replace(/\D/g, "");

            const resultado = document.getElementById("resultado");

            if (cep.length !== 8) {
                resultado.innerText =
                    "Digite um CEP válido com 8 números.";
                return;
            }

            resultado.innerText = "Buscando endereço...";

            try {
                const resposta = await fetch(
                    `https://viacep.com.br/ws/${cep}/json/`
                );

                if (!resposta.ok) {
                    throw new Error("Erro na consulta do CEP");
                }

                const dados = await resposta.json();

                if (dados.erro) {
                    resultado.innerText = "CEP não encontrado.";
                    return;
                }

                resultado.innerText =
                    "Rua: " + (dados.logradouro || "Não informado") +
                    "\nBairro: " + (dados.bairro || "Não informado") +
                    "\nCidade: " + dados.localidade +
                    "\nEstado: " + dados.uf;

            } catch (erro) {
                resultado.innerText =
                    "Erro ao consultar o CEP. Tente novamente.";
                console.error(erro);
            }
        }

        // FRASES DO CHUCK NORRIS
        async function buscarFrase() {
            const frase = document.getElementById("frase");

            frase.innerText = "Carregando frase...";

            try {
                const resposta = await fetch(
                    "https://api.chucknorris.io/jokes/random"
                );

                if (!resposta.ok) {
                    throw new Error("Erro ao buscar frase");
                }

                const dados = await resposta.json();

                frase.innerText = dados.value;

            } catch (erro) {
                frase.innerText =
                    "Não foi possível carregar a frase. Tente novamente.";
                console.error(erro);
            }
        }
    </script>

</body>
</html>
